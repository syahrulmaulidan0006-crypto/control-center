name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
      - name: Terbitkan APK di Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ControlCenter.apk
          gh release create "v${{ github.run_number }}-${{ github.run_attempt }}" ControlCenter.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Control Center v${{ github.run_number }}" \
            --notes "Unduh ControlCenter.apk lalu pasang di HP (Android 10+)."
