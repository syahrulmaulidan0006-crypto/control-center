name: Uji emulator
on:
  push:
    branches: [uji]
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Tambahkan pemutar musik tiruan
        run: |
          cp uji/TestMusic.java uji/TestWall.java app/src/main/java/com/example/controlcenter/
          sed -i 's#</application>#<receiver android:name=".TestMusic" android:exported="true" /><activity android:name=".TestWall" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" /></application>#' app/src/main/AndroidManifest.xml
      - run: gradle assembleDebug
      - name: Izinkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_4
          script: bash uji.sh
